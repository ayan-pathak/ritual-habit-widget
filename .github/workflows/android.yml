name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the Firebase config, when there is one
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # google-services.json is per-project and never checked in, so the
          # only way it reaches a build made here is a repository secret. With
          # no secret this is a no-op and the app runs with no cloud to reach,
          # which is the same path a signed-out device takes.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase configured: sign-in and sync are live in this build."
          else
            echo "No GOOGLE_SERVICES_JSON secret. Building without a cloud."
          fi

      - name: Check the generated Mochi art matches art/mochi/*.svg
        run: python3 tools/mochi.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ritual-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
