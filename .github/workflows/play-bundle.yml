name: Play bundle

# Play takes an Android App Bundle, not an APK, and refuses a second upload at
# a versionCode it has already seen. Run this by hand from the Actions tab when
# there is something to put in front of testers; the run number becomes the
# versionCode, so it climbs on its own and never repeats.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to people, e.g. 1.0.3'
        required: false
        default: '1.0'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::No GOOGLE_SERVICES_JSON secret. A bundle without it" \
                 "ships an app that cannot sign anyone in."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Stage the upload key, if there is one
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          # The dev key is in this repository, so it is the wrong thing to hand
          # Play. With the secret set the bundle is signed with a key only the
          # repository owner holds; without it the build still works, and says
          # loudly what it did.
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > keystore/upload.jks
            echo "Signed with the upload key."
          else
            echo "::warning::No UPLOAD_KEYSTORE_BASE64 secret, so this bundle is" \
                 "signed with the development key that is checked into this" \
                 "public repository. Good enough to see billing work; replace it" \
                 "before anything reaches a real person."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon --stacktrace \
            -PritualVersionCode=${{ github.run_number }} \
            -PritualVersionName=${{ inputs.version_name }}

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          tag="bundle-${{ github.run_number }}"
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab \
             "out/ritual-${{ inputs.version_name }}-${{ github.run_number }}.aab"
          gh release create "$tag" out/*.aab \
            --title "Ritual bundle ${{ inputs.version_name }} (${{ github.run_number }})" \
            --notes "versionCode ${{ github.run_number }}, from $short. Upload this to Play Console."
