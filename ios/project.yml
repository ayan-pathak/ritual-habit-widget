# Generated into an .xcodeproj by XcodeGen at build time.
#
# The project file itself is not checked in: it is entirely derived from this
# spec, and a generated pbxproj is a merge conflict waiting to happen. Run
# `xcodegen generate` in this directory, then open Ritual.xcodeproj.

name: Ritual

options:
  bundleIdPrefix: com.ayan
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.4.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:

  Ritual:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Ritual
      - path: Resources
    # The Info.plists are generated rather than hand-written: XcodeGen fills in
    # the CFBundle* keys Xcode injects for you, and the App Intents metadata
    # step refuses to parse a plist that is missing them.
    info:
      path: Ritual/Info.plist
      properties:
        CFBundleDisplayName: Ritual
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Archivo.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: com.ayan.ritual
            CFBundleURLSchemes: [ritual]
          # Google hands the sign-in back on the reversed client id, which is
          # per-project and so comes from a build setting rather than being
          # written down here. bootstrap.sh reads it out of the plist.
          - CFBundleURLName: com.googleusercontent.apps
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        LSApplicationQueriesSchemes: [instagram-stories, instagram]
    configFiles:
      Debug: Config/Google.xcconfig
      Release: Config/Google.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayan.ritual
        PRODUCT_NAME: Ritual
        CODE_SIGN_ENTITLEMENTS: Ritual/Ritual.entitlements
    dependencies:
      - target: RitualWidgetExtension
        embed: true
      # The app talks to the cloud; the widget only ever reads the local
      # store, so it stays free of all of this.
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn

  RitualWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: RitualWidget
      - path: Resources
    info:
      path: RitualWidget/Info.plist
      properties:
        CFBundleDisplayName: Ritual
        UIAppFonts: [Archivo.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayan.ritual.widget
        PRODUCT_NAME: RitualWidget
        CODE_SIGN_ENTITLEMENTS: RitualWidget/RitualWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  Ritual:
    build:
      targets:
        Ritual: all
        RitualWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
