<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ritual Pencil Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap">
<style>
  :root{
    --page:#E7E3D4; --surface:#F4F2EA; --ink:#12120F; --on-ink:#F4F2EA;

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page:#12120F; --surface:#1C1C18; --ink:#F4F2EA; --on-ink:#12120F;
      --ink-soft:rgba(244,242,234,.6); --rule:rgba(244,242,234,.14); color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --page:#12120F; --surface:#1C1C18; --ink:#F4F2EA; --on-ink:#12120F;
    --ink-soft:rgba(244,242,234,.6); --rule:rgba(244,242,234,.14); color-scheme:dark; }

  html,body{background:var(--page)}
  body{color:var(--ink);font:500 15px/1.5 Archivo,"Segoe UI",system-ui,sans-serif;padding-inline:16px;padding-block:32px 64px}
  .wrap{max-width:1160px;margin:0 auto;display:grid;gap:20px}
  .eyebrow{font:700 12px/1 Archivo,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin:0}
  h1{font-weight:800;font-size:clamp(30px,5vw,50px);line-height:1;letter-spacing:-.03em;margin:.35em 0 0;text-wrap:balance}
  .stage{border-radius:14px;overflow:hidden;background:#F4F2EA}
  .stage:fullscreen{display:grid;place-items:center;border-radius:0;background:#000}
  .stage:fullscreen canvas{width:min(100vw,177.78vh)}
  .stage.max{position:fixed;inset:0;z-index:50;border-radius:0;background:#000;display:grid;place-items:center;max-width:none;margin:0}
  .stage.max canvas{width:min(100vw,177.78vh)}
  .exitmax{position:absolute;top:14px;right:14px;z-index:2;display:none;background:rgba(18,18,15,.7);color:#F4F2EA;border:1px solid rgba(244,242,234,.3)}

  canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;cursor:pointer}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  button{background:var(--surface);border:1px solid var(--rule);color:var(--ink);height:40px;padding:0 16px;border-radius:999px;
    font:600 14px/1 Archivo,system-ui,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  button:hover{border-color:var(--ink-soft)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  button.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime);min-width:104px;justify-content:center}
  button svg{width:14px;height:14px;fill:currentColor}
  input[type=range]{flex:1 1 220px;accent-color:var(--ink);min-width:0}
  .tc{font:600 13px/1 Archivo,system-ui,sans-serif;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
  label.loop{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer}
  label.loop input{accent-color:var(--ink)}

  .shots button{width:100%;height:auto;border-radius:10px;padding:11px 12px 12px;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
  .shots .t{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .shots .n{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .shots .d{font-weight:500;font-size:12.5px;line-height:1.35;color:var(--ink-soft)}
  .shots li[aria-current="true"] button{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--lime)}
  @media (max-width:560px){.tc{min-width:0}}

  /* Embedded in the home page: the frame and its controls only. */
  html.embed, html.embed body{background:transparent}
  html.embed body{padding:0;overflow:hidden}
  html.embed .wrap{max-width:none;gap:0}
  html.embed .wrap > div:first-child, html.embed .wrap > .eyebrow, html.embed .shots{display:none}
  html.embed .stage{border-radius:0}
  html.embed .bar{position:fixed;left:12px;right:12px;bottom:12px;padding:8px 10px;border-radius:14px;background:rgba(18,18,15,.72);
    color:#F4F2EA;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
  html.embed body:hover .bar, html.embed .bar:focus-within, html.embed.paused .bar{opacity:1;transform:none}
  html.embed .bar button{color:#F4F2EA;background:rgba(244,242,234,.12);border-color:transparent}
  html.embed .bar button.primary{background:#C9F73F;color:#12120F}
  html.embed .bar .loop, html.embed #restart{display:none}
  html.embed .tc{color:rgba(244,242,234,.7)}
  html.embed #scrub{accent-color:#C9F73F}
</style>

<script>if (/[?&]embed/.test(location.search)) document.documentElement.classList.add("embed");</script>
<div class="wrap">
  <div>
    <p class="eyebrow">Ritual · :30 spot · pencil on paper</p>
    <h1>For 50,000 years, your habits were chosen for you.</h1>
  </div>

  <div class="stage" id="stageWrap">
    <button class="exitmax" id="exitmax" type="button">Exit full screen</button>
    <canvas id="stage" role="img" aria-label="Animated pencil-sketch ad: hunger, the seasons, the clock and the phone chose people's habits; now you choose, one square a day, with Ritual"></canvas>
  </div>

  <div class="bar">
    <button class="primary" id="play"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2.5v11l9-5.5z"/></svg><span id="playTxt">Play</span></button>
    <button id="restart"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.4.5A4 4 0 1 0 8 4v2L4.5 3.2 8 .5z"/></svg>Replay</button>
    <input type="range" id="scrub" min="0" max="30" step="0.01" value="0" aria-label="Seek">
    <span class="tc" id="tc">0:00.0 / 0:30</span>
    <label class="loop"><input type="checkbox" id="loop"> Loop</label>
    <button id="fs"><svg viewBox="0 0 16 16"><path d="M2 2h5v1.5H3.5V7H2zm7 0h5v5h-1.5V3.5H9zM2 9h1.5v3.5H7V14H2zm10.5 0H14v5H9v-1.5h3.5z"/></svg>Full screen</button>
  </div>

  <p class="eyebrow">Shot list</p>
  <ol class="shots" id="shots"></ol>
</div>

<script>
(() => {
const W = 1600, H = 900, PAN = 0.45, GY = 780, TY = 852;
const INK = '#12120F', PAPER = '#F4F2EA', CREAM = '#E7E3D4';
const LIME = '#C9F73F', RED = '#E5331C', BUTTER = '#EDE55C', ORANGE = '#F26A1B';
const ARCH = 'Archivo, "Segoe UI", system-ui, sans-serif';
const LIGHT = [-.6, -.8];

const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let k = 1, SID = 0, BOIL = 0, T = 0, tip = null, LOGO_TH = null;
const IMG = {};
const load = (key, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[key] = i; r(); }; i.onerror = () => r(); i.src = src; });
const assets = Promise.all([load('resting', 'mochi/resting.svg'), load('pleased', 'mochi/pleased.svg'), load('icon', 'img/icon.png')]);

/* ================= math ================= */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (v, a, b) => clamp((v - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const lp = (A, B, t) => [lerp(A[0], B[0], t), lerp(A[1], B[1], t)];
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { if (x <= 0) return 0; if (x >= 1) return 1; const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const add = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s];
const unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
function hash(a, b) {
  let x = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x9e3779b1);
  x = Math.imul(x ^ (x >>> 15), 0x85ebca6b); x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35); x ^= x >>> 16;
  return (x >>> 0) / 4294967295 * 2 - 1;
}

/* ================= point builders ================= */
function ln(x1, y1, x2, y2, step = 22) {
  const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step)), o = [];
  for (let i = 0; i <= n; i++) o.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
  return o;
}
function poly(ps, step) { let o = []; for (let i = 0; i < ps.length - 1; i++) { const s = ln(ps[i][0], ps[i][1], ps[i + 1][0], ps[i + 1][1], step); o = o.concat(i ? s.slice(1) : s); } return o; }
function circ(cx, cy, rx, ry = rx, a0 = -2.2, sw = Math.PI * 2.1) {
  const n = Math.max(12, Math.ceil(Math.abs(sw) * Math.max(rx, ry) / 14)), o = [];
  for (let i = 0; i <= n; i++) { const a = a0 + sw * i / n, q = 1 + .03 * Math.sin(i / n * 10); o.push([cx + Math.cos(a) * rx * q, cy + Math.sin(a) * ry * q]); }
  return o;
}
function bez(a, b, c, d, n = 24) {
  const o = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t;
    o.push([u*u*u*a[0] + 3*u*u*t*b[0] + 3*u*t*t*c[0] + t*t*t*d[0], u*u*u*a[1] + 3*u*u*t*b[1] + 3*u*t*t*c[1] + t*t*t*d[1]]); }
  return o;
}
function rr(x, y, w, h, r) {
  const o = [], arc = (cx, cy, a0) => { for (let i = 0; i <= 5; i++) { const a = a0 + i / 5 * Math.PI / 2; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  arc(x + w - r, y + r, -Math.PI / 2); arc(x + w - r, y + h - r, 0); arc(x + r, y + h - r, Math.PI / 2); arc(x + r, y + r, Math.PI); o.push([x + r + 3, y - 1]);
  return poly(o);
}
function cut(P, p) {
  if (p >= 1) return P;
  const d = [0]; let L = 0;
  for (let i = 1; i < P.length; i++) { L += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); d.push(L); }
  const tg = L * p, o = [P[0]];
  for (let i = 1; i < P.length; i++) {
    if (d[i] <= tg) o.push(P[i]);
    else { const f = (tg - d[i - 1]) / (d[i] - d[i - 1] || 1); o.push(lp(P[i - 1], P[i], f)); break; }

}
function trace(P) {
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length - 1; i++) ctx.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);

/* ================= pencil ================= */
function sk(pts, p = 1, o = {}) {
  const id = o.id ?? ++SID;
  if (p <= 0 || !pts || pts.length < 2) return null;
  const amp = o.amp ?? 1.3, a = o.a ?? 1;
  const J = pts.map((q, i) => [q[0] + hash(id * 97 + i, BOIL) * amp, q[1] + hash(id * 97 + i, BOIL + 7919) * amp]);
  const P = cut(J, p);
  ctx.strokeStyle = o.c || INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = a * .9; ctx.lineWidth = o.w || 2.2; trace(P); ctx.stroke();

    ctx.globalAlpha = a * .38; ctx.lineWidth = (o.w || 2.2) * .5; trace(P.map(q => [q[0] + dx, q[1] + dy])); ctx.stroke();

}
/* Ritual's lime marker, edged in ink so it reads on paper. */
function mark(pts, p, w = 8) { const id = ++SID; sk(pts, p, { c: INK, w: w + 4, one: true, id, amp: 1 }); sk(pts, p, { c: LIME, w, one: true, id, amp: 1 }); }
function fillPts(pts, col, a = 1) { if (a <= 0 || !pts || pts.length < 3) return; ctx.globalAlpha = a; ctx.fillStyle = col; trace(pts); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }
function hatch(pts, p, o = {}) {
  const base = SID; SID += 200;
  if (p <= 0 || pts.length < 3) return;
  ctx.save(); trace(pts); ctx.closePath(); ctx.clip();

  for (const q of pts) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }

  for (let x = x0 - h; x < x1; x += gap) xs.push(x);
  const n = Math.min(xs.length, Math.floor(xs.length * p) + 1), keep = SID, st = Math.max(30, h);
  for (let i = 0; i < n; i++) { SID = base + i; sk(ln(xs[i], y1 + 4, xs[i] + h + 8, y0 - 4, st), 1, { w: o.w || 1.1, a: o.a ?? .4, one: true, amp: .8, c: o.c || INK }); }

  SID = keep; ctx.restore();
}
function sq(x, y, s, col, a = 1, r = .28) { if (a <= 0 || s <= 0) return; ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, s, s, s * r); ctx.fill(); ctx.globalAlpha = 1; }
function dot(x, y, r, col = INK, a = 1) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }

/* ================= type ================= */
const font = (size, wt = 800) => `${wt} ${size}px ${ARCH}`;
function setLS(v) { if ('letterSpacing' in ctx) ctx.letterSpacing = v; }
function measure(txt, f, ls = '0px') { ctx.save(); ctx.font = f; setLS(ls); const w = ctx.measureText(txt).width; ctx.restore(); return w; }
function write(parts, x, y, size, p, o = {}) {
  if (typeof parts === 'string') parts = [[parts, false]];
  const f = font(size, o.wt || 800), ls = o.ls ?? `${-.025 * size}px`;
  const ws = parts.map(q => measure(q[0], f, ls)), tw = ws.reduce((a, b) => a + b, 0);
  const sx = o.center ? x - tw / 2 : x;
  if (o.hl !== undefined) { let cx = sx;
    parts.forEach((q, i) => { if (q[1]) sk(ln(cx - 8, y - size * .3, cx + ws[i] + 6, y - size * .34, 40), o.hl, { c: LIME, w: size * .62, one: true, amp: 1.2 }); else SID++; cx += ws[i]; }); }
  if (p <= 0) return tw;
  ctx.save(); ctx.font = f; setLS(ls); ctx.textAlign = 'left';
  ctx.beginPath(); ctx.rect(sx - 24, y - size * 1.3, (tw + 48) * p, size * 1.9); ctx.clip();
  let cx = sx;
  parts.forEach((q, i) => {
    ctx.globalAlpha = o.a ?? 1;
    if (o.inked) {
      ctx.fillStyle = o.fill; ctx.fillText(q[0], cx, y);
      ctx.strokeStyle = INK; ctx.lineJoin = 'round';
      const d1 = hash(SID + i, BOIL) * 1.3, d2 = hash(SID + i, BOIL + 5) * 1.3;
      ctx.lineWidth = o.inked; ctx.strokeText(q[0], cx + d1, y + d2);
      ctx.globalAlpha = .4; ctx.lineWidth = o.inked * .5; ctx.strokeText(q[0], cx - d2, y + d1);
    } else { ctx.fillStyle = o.c || INK; ctx.fillText(q[0], cx, y); }
    cx += ws[i];
  });

}
function label(txt, x, y, size, p, o = {}) {
  if (p <= 0) return 0;
  ctx.save(); ctx.font = font(size, o.wt || 700); setLS(`${(o.track ?? .2) * size}px`);
  ctx.textAlign = o.align || 'left'; ctx.fillStyle = o.c || INK; ctx.globalAlpha = (o.a ?? 1) * p;
  ctx.fillText(txt, x, y); const w = ctx.measureText(txt).width; ctx.restore(); return w;
}
function stamp(txt, x, y, lt) {
  const w = measure(txt, font(20, 700), `${.2 * 20}px`);
  sk(poly([[x - 16, y - 30], [x + w + 18, y - 33], [x + w + 20, y + 14], [x - 18, y + 16], [x - 15, y - 35]]), seg(lt, .08, .4), { w: 1.8, a: .7 });
  label(txt, x, y, 20, seg(lt, .05, .3), { a: .7 });
}
function caption(era, parts, lt) { stamp(era.toUpperCase(), 112, 126, lt); write(parts, 108, 236, 70, eo(seg(lt, .3, .95)), { hl: eo(seg(lt, .75, 1.1)) }); }
function pencil(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-1.0);
  ctx.globalAlpha = .1; ctx.fillStyle = INK; ctx.fillRect(40, 4, 160, 22); ctx.globalAlpha = 1;
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
  ctx.fillStyle = LIME; ctx.beginPath(); ctx.rect(34, -11, 150, 22); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = .25; ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(184, 0); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = INK; ctx.fillRect(184, -11, 20, 22);
  ctx.fillStyle = '#E9D6B8'; ctx.beginPath(); ctx.moveTo(34, -11); ctx.lineTo(0, 0); ctx.lineTo(34, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(11, -3.8); ctx.lineTo(0, 0); ctx.lineTo(11, 3.8); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* =====================================================================
   People, drawn properly: contoured limbs, profile heads, hands with
   fingers, clothes with seams and folds, hatched on the shadow side.
   ===================================================================== */
const interp = (keys, u) => { for (let i = 1; i < keys.length; i++) if (u <= keys[i][0]) { const [u0, r0] = keys[i - 1], [u1, r1] = keys[i]; return lerp(r0, r1, (u - u0) / (u1 - u0 || 1)); } return keys[keys.length - 1][1]; };
const PROF = {
  arm:     [[0, 10], [.2, 10.4], [.44, 7.6], [.5, 7], [.62, 8.4], [.86, 6], [1, 5.2]],
  sleeveL: [[0, 12.5], [.45, 10.5], [.5, 10], [.62, 10], [1, 8.2]],
  leg:     [[0, 15], [.18, 14], [.46, 9.6], [.5, 9], [.62, 10.8], [.86, 6.8], [1, 5.8]],
  pants:   [[0, 17], [.46, 12], [.5, 11.6], [.7, 11], [1, 9.8]],
};
function pathPts(J, n = 9) { const o = []; for (let s = 0; s < J.length - 1; s++) for (let i = s ? 1 : 0; i <= n; i++) o.push(lp(J[s], J[s + 1], i / n)); return o; }
function sides(P, R) {
  const A = [], B = [];
  for (let i = 0; i < P.length; i++) { const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)], [tx, ty] = unit(a, b);
    A.push([P[i][0] - ty * R[i], P[i][1] + tx * R[i]]); B.push([P[i][0] + ty * R[i], P[i][1] - tx * R[i]]); }
  return [A, B];
}
/* One limb or sleeve: fill with paper to occlude, hatch the shadow side, draw both contours. */
function limb(J, keys, s, p, o = {}) {
  const P = pathPts(J), R = P.map((_, i) => interp(keys, i / (P.length - 1)) * s), [A, B] = sides(P, R);
  if (p <= 0) { SID += 206; return { A, B, P }; }
  const body = A.concat(B.slice().reverse());
  fillPts(body, PAPER, seg(p, 0, .3));
  if (o.wash) fillPts(body, o.wash, .55 * seg(p, .3, .8));
  const m = Math.floor(P.length / 2), nA = unit(P[m], A[m]), shadowA = nA[0] * LIGHT[0] + nA[1] * LIGHT[1] < 0;
  if (o.cloth) hatch(body, seg(p, .4, .9), { gap: 8, a: .2, cross: o.cross }); else SID += 200;

function sRoles(lt) {

/* The Ritual card, drawn like the app draws it. */
const TODAY = 208, LIT = (() => { const a = []; for (let i = 0; i < 365; i++) a.push(i < TODAY && (i >= TODAY - 12 || hash(i, 5) > -.62)); return a; })();
const LIT_N = LIT.filter(Boolean).length;
function card(x, y, w, h, sweep, flip) {

function sCard(lt) {
  write([['One tap a day. ', false], ['Nothing resets.', true]], 800, 170, 64, eo(seg(lt, .15, .8)), { center: true, hl: eo(seg(lt, .7, 1.1)) });
  const cx = 420, cy = 230, cw = 760, ch = 426, pop = back(seg(lt, .05, .45));

    ctx.beginPath(); ctx.roundRect(ix, iy, is, is, r); ctx.save(); ctx.clip();

    ctx.save(); ctx.translate(800, 688); ctx.scale(pq, pq); ctx.fillStyle = LIME; ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fill();

const SC = [
  { t0: 0,    fn: sHook,   n: 'Hook',      d: '“For 50,000 years, your habits were chosen for you.”' },
  { t0: 2.8,  fn: sHunter, n: 'Hunter',    d: 'Cave, fire, a bearded hunter. “Hunger chose the hunter’s.”' },
  { t0: 6.0,  fn: sFarmer, n: 'Farmer',    d: 'Sun wheels over. “The seasons chose the farmer’s.”' },
  { t0: 9.0,  fn: sWorker, n: 'Worker',    d: 'Three men in lockstep. “The clock chose the worker’s.”' },
  { t0: 12.0, fn: sNow,    n: 'Distraction', d: '“Today, everything pulls at you.”' },
  { t0: 16.0, fn: sRoles,  n: 'You choose', d: 'Reader, runner, guitarist, painter, each with a year’s maths.' },
  { t0: 24.0, fn: sCard,   n: 'One tap',   d: '“One tap a day. Nothing resets.” The card flips to ink.' },
  { t0: 27.0, fn: sEnd,    n: 'Ritual',    d: 'White end card, lime accents, Mochi’s app icon.' },
];
const END = 30;
const dur = i => (SC[i + 1] ? SC[i + 1].t0 : END) - SC[i].t0;

/* Each scene's lime thread draws one small square: one kept day. */
const LX = 1490, LS = 40;
const TH = ln(0, TY, LX, TY, 30).concat(poly([[LX, TY], [LX, TY - LS], [LX + LS, TY - LS], [LX + LS, TY]]).slice(1), ln(LX + LS, TY, W, TY, 30).slice(1));
const TH_DONE = (LX + LS * 3) / (W + LS * 2);
function thread(i, t) {
  let p, pts;
  if (i < SC.length - 1) { p = seg(t, i ? SC[i].t0 + .3 : .15, SC[i + 1].t0 + .3); pts = TH;
    const tf = (i ? SC[i].t0 + .3 : .15) + (SC[i + 1].t0 + .3 - (i ? SC[i].t0 + .3 : .15)) * TH_DONE, fq = back(seg(t, tf, tf + .25));
    if (fq > 0) { const s = (LS - 10) * fq; sq(LX + LS / 2 - s / 2, TY - LS / 2 - s / 2, s, LIME, 1, .25); }

/* ================= paper ================= */
const gc = document.createElement('canvas'); gc.width = gc.height = 320;
const gx = gc.getContext('2d'); let sd = 7; const rn = () => (sd = sd * 16807 % 2147483647) / 2147483647;
for (let i = 0; i < 7000; i++) { const v = rn() < .5 ? 40 : 255; gx.fillStyle = `rgba(${v},${v},${v - 10},${.035 + rn() * .05})`; gx.fillRect(rn() * 320, rn() * 320, 1 + rn() * 1.6, 1 + rn() * 1.6); }
for (let i = 0; i < 70; i++) { gx.strokeStyle = `rgba(80,78,64,${.03 + rn() * .05})`; gx.lineWidth = .7; gx.beginPath(); const x = rn() * 320, y = rn() * 320, a = rn() * 6.28, l = 6 + rn() * 18; gx.moveTo(x, y); gx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); gx.stroke(); }
const grain = ctx.createPattern(gc, 'repeat');

function render(t) {
  T = t; BOIL = Math.floor(performance.now() / 110); tip = null;
  const c = cam(t), lt = t - SC[c.i].t0;
  let amp = 0;
  if (c.i === 4) amp = 7 * seg(lt, 1.0, 2.2) * (1 - seg(lt, 2.4, 2.7));

/* ================= player ================= */
const $ = id => document.getElementById(id);
const scrub = $('scrub'), tc = $('tc'), loopBox = $('loop'), shotsEl = $('shots');
let t = 0, playing = false, last = null;
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
SC.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<button type="button"><span class="t">${fmt(s.t0).replace(/\.\d$/, '')}</span><span class="n">${s.n}</span><span class="d">${s.d}</span></button>`;

  shotsEl.appendChild(li);
});

window.__seek = v => { t = v; setPlaying(false); };
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const fonts = document.fonts ? Promise.all([800, 700, 600, 500].map(w => document.fonts.load(font(60, w)))) : Promise.resolve();
Promise.race([Promise.all([assets, fonts]), new Promise(r => setTimeout(r, 3000))]).catch(() => {}).then(() => {
  const embed = document.documentElement.classList.contains('embed');
  if (embed) {
    /* On the home page it loops, and plays only while it is on screen. */
    loopBox.checked = true;

    cv.addEventListener('click', () => { userPaused = !playing; });
    $('play').addEventListener('click', () => { userPaused = !playing; });

    setInterval(mark, 250);
    if (reduce) { t = 6; setPlaying(false); }

});
})();
